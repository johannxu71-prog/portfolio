<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f8fb"/>
      <stop offset="60%" stop-color="#e3edf4"/>
      <stop offset="100%" stop-color="#d2e1ec"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe0f2"/>
      <stop offset="100%" stop-color="#7fb4d4"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fbdd8"/>
      <stop offset="100%" stop-color="#6d9cbd"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>

  <!-- 产品主体 -->
  <ellipse cx="800" cy="392" rx="135" ry="20" fill="#a9cbdf" opacity="0.55" filter="url(#soft)"/>
  <rect x="738" y="152" width="124" height="228" rx="26" fill="url(#bottle)"/>
  <rect x="738" y="152" width="124" height="228" rx="26" fill="none" stroke="#5f93b3" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="768" y="112" width="64" height="44" rx="9" fill="url(#cap)"/>
  <rect x="758" y="196" width="84" height="110" rx="10" fill="#ffffff" opacity="0.55"/>
  <rect x="770" y="228" width="60" height="3" fill="#5f93b3" opacity="0.5"/>
  <rect x="770" y="244" width="60" height="3" fill="#5f93b3" opacity="0.35"/>
  <rect x="770" y="260" width="38" height="3" fill="#5f93b3" opacity="0.35"/>
  <ellipse cx="772" cy="188" rx="9" ry="26" fill="#ffffff" opacity="0.8"/>

  <!-- 水珠 -->
  <g fill="#8fc0dd" opacity="0.75">
    <circle cx="935" cy="205" r="7"/><circle cx="962" cy="252" r="4.5"/><circle cx="918" cy="288" r="5.5"/>
    <circle cx="655" cy="182" r="6"/><circle cx="632" cy="245" r="4"/><circle cx="668" cy="300" r="5"/>
    <circle cx="948" cy="330" r="4"/>
  </g>

  <!-- 标题区 -->
  <text x="800" y="470" text-anchor="middle" font-family="Menlo, monospace" font-size="15" letter-spacing="9" fill="#7d99a8">COMMERCIAL DEMO</text>
  <rect x="740" y="497" width="120" height="2" fill="#5f93b3" fill-opacity="0.9"/>
  <text x="800" y="600" text-anchor="middle" font-family="'Songti SC','STSong','SimSun',serif" font-weight="700" font-size="84" letter-spacing="12" fill="#22333f">安尔康广告片</text>
  <text x="800" y="672" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="25" letter-spacing="14" fill="#4a6472">制作 · 商业项目</text>
</svg>
