<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14100a"/>
      <stop offset="55%" stop-color="#0b0906"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="26%" r="48%">
      <stop offset="0%" stop-color="#d9b877" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d9b877" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- 碎裂玻璃 -->
  <g stroke="#d9b877" stroke-opacity="0.55" stroke-width="1.6" fill="none">
    <line x1="800" y1="240" x2="560" y2="140"/><line x1="800" y1="240" x2="700" y2="60"/>
    <line x1="800" y1="240" x2="880" y2="70"/><line x1="800" y1="240" x2="1030" y2="130"/>
    <line x1="800" y1="240" x2="1120" y2="300"/><line x1="800" y1="240" x2="1005" y2="395"/>
    <line x1="800" y1="240" x2="760" y2="420"/><line x1="800" y1="240" x2="590" y2="360"/>
    <line x1="800" y1="240" x2="475" y2="255"/>
  </g>
  <g stroke="#f2e2c0" stroke-opacity="0.28" stroke-width="1" fill="none">
    <line x1="700" y1="60" x2="475" y2="255"/><line x1="1030" y1="130" x2="1120" y2="300"/>
    <line x1="880" y1="70" x2="1005" y2="395"/><line x1="560" y1="140" x2="590" y2="360"/>
  </g>
  <g fill="#d9b877">
    <polygon points="800,240 700,60 880,70" opacity="0.07"/>
    <polygon points="800,240 1030,130 1120,300" opacity="0.06"/>
    <polygon points="800,240 590,360 760,420" opacity="0.05"/>
  </g>
  <circle cx="800" cy="240" r="5" fill="#f2e2c0" opacity="0.9"/>
  <circle cx="800" cy="240" r="14" fill="none" stroke="#d9b877" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="800" cy="240" r="34" fill="none" stroke="#d9b877" stroke-opacity="0.22" stroke-width="1.5" filter="url(#soft)"/>

  <!-- 标题区 -->
  <text x="800" y="470" text-anchor="middle" font-family="Menlo, monospace" font-size="15" letter-spacing="9" fill="#8a7448">A SHORT FILM</text>
  <rect x="740" y="497" width="120" height="2" fill="#c9a96a" fill-opacity="0.9"/>
  <text x="800" y="600" text-anchor="middle" font-family="'Songti SC','STSong','SimSun',serif" font-weight="700" font-size="84" letter-spacing="12" fill="#f2ecdf">《精致的代价》</text>
  <text x="800" y="672" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="25" letter-spacing="14" fill="#c9a96a">制作</text>

  <rect width="1600" height="900" fill="url(#vig)"/>
  <rect width="1600" height="900" filter="url(#noise)" opacity="0.045"/>
</svg>
