<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16161a"/>
      <stop offset="60%" stop-color="#0e0e10"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="50%">
      <stop offset="0%" stop-color="#c9a96a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c9a96a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#glow)"/>

  <!-- 片场光斑 -->
  <g filter="url(#soft)">
    <circle cx="160" cy="220" r="60" fill="#e8c98a" opacity="0.12"/>
    <circle cx="760" cy="180" r="45" fill="#e8c98a" opacity="0.10"/>
    <circle cx="120" cy="620" r="40" fill="#c9a96a" opacity="0.08"/>
    <circle cx="800" cy="560" r="55" fill="#e8c98a" opacity="0.09"/>
  </g>

  <!-- 圆形相框 -->
  <circle cx="450" cy="470" r="215" fill="none" stroke="#c9a96a" stroke-width="2" stroke-opacity="0.9"/>
  <circle cx="450" cy="470" r="192" fill="none" stroke="#c9a96a" stroke-width="1" stroke-opacity="0.3"/>

  <!-- 摄影机图形 -->
  <g stroke="#c9a96a" stroke-width="3" fill="none" stroke-linejoin="round">
    <rect x="362" y="428" width="176" height="98" rx="14"/>
    <path d="M 418 428 v -22 h 64 v 22"/>
    <circle cx="450" cy="477" r="35"/>
    <circle cx="450" cy="477" r="20" stroke-opacity="0.55"/>
    <circle cx="512" cy="446" r="6" fill="#c9a96a" stroke="none"/>
  </g>
  <path d="M 538 452 l 42 -16 v 74 l -42 -16 z" fill="#c9a96a" fill-opacity="0.85"/>

  <!-- 文案 -->
  <text x="450" y="805" text-anchor="middle" font-family="'Songti SC','STSong','SimSun',serif" font-weight="600" font-size="42" letter-spacing="18" fill="#eae6de">个人照片</text>
  <rect x="395" y="845" width="110" height="1.5" fill="#c9a96a" fill-opacity="0.7"/>
  <text x="450" y="895" text-anchor="middle" font-family="Menlo, monospace" font-size="15" letter-spacing="8" fill="#9a958c">PORTRAIT</text>

  <rect width="900" height="1200" fill="url(#vig)"/>
  <rect width="900" height="1200" filter="url(#noise)" opacity="0.045"/>
</svg>
