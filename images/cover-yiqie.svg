<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="60%" stop-color="#100b05"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#e8a24a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#e8a24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- 雨夜车窗光斑 -->
  <g filter="url(#soft)">
    <circle cx="1120" cy="190" r="85" fill="#e8a24a" opacity="0.20"/>
    <circle cx="1260" cy="300" r="55" fill="#f2c374" opacity="0.16"/>
    <circle cx="985" cy="330" r="65" fill="#d98e3a" opacity="0.14"/>
    <circle cx="1380" cy="180" r="45" fill="#f2c374" opacity="0.18"/>
    <circle cx="360" cy="240" r="70" fill="#c77f34" opacity="0.12"/>
    <circle cx="180" cy="150" r="48" fill="#e8a24a" opacity="0.10"/>
    <circle cx="530" cy="160" r="40" fill="#f2c374" opacity="0.12"/>
  </g>
  <g fill="#f2c374">
    <circle cx="1090" cy="160" r="7" opacity="0.7"/><circle cx="1195" cy="255" r="5" opacity="0.55"/>
    <circle cx="1300" cy="205" r="8" opacity="0.6"/><circle cx="1410" cy="290" r="5.5" opacity="0.5"/>
    <circle cx="905" cy="240" r="5" opacity="0.45"/><circle cx="1250" cy="345" r="4" opacity="0.4"/>
  </g>

  <!-- 雨痕 -->
  <g stroke="#caa46a" stroke-opacity="0.14" stroke-width="1.6" stroke-linecap="round">
    <line x1="440" y1="70" x2="428" y2="150"/><line x1="560" y1="40" x2="552" y2="115"/>
    <line x1="680" y1="90" x2="666" y2="180"/><line x1="820" y1="50" x2="810" y2="130"/>
    <line x1="940" y1="110" x2="930" y2="185"/><line x1="1080" y1="60" x2="1072" y2="140"/>
    <line x1="1220" y1="95" x2="1210" y2="170"/><line x1="1350" y1="55" x2="1344" y2="120"/>
    <line x1="1470" y1="120" x2="1462" y2="195"/><line x1="300" y1="80" x2="292" y2="150"/>
  </g>

  <!-- 标题区 -->
  <text x="800" y="445" text-anchor="middle" font-family="Menlo, monospace" font-size="15" letter-spacing="9" fill="#8a6c40">A SHORT FILM</text>
  <rect x="740" y="472" width="120" height="2" fill="#c9a96a" fill-opacity="0.9"/>
  <text x="800" y="580" text-anchor="middle" font-family="'Songti SC','STSong','SimSun',serif" font-weight="700" font-size="88" letter-spacing="14" fill="#f4ecdd">《一切还好》</text>
  <text x="800" y="655" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="25" letter-spacing="14" fill="#c9a96a">导演 · 编剧 · 制片</text>

  <rect width="1600" height="900" fill="url(#vig)"/>
  <rect width="1600" height="900" filter="url(#noise)" opacity="0.045"/>
</svg>
