<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b151a"/>
      <stop offset="55%" stop-color="#071013"/>
      <stop offset="100%" stop-color="#040708"/>
    </linearGradient>
    <radialGradient id="glow1" cx="28%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#2e8ba3" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2e8ba3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="78%" cy="82%" r="50%">
      <stop offset="0%" stop-color="#c9a96a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c9a96a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- 取景框 -->
  <g stroke="#dfe9ec" stroke-opacity="0.75" stroke-width="3" fill="none">
    <path d="M 545 170 h 60 M 545 170 v 60"/>
    <path d="M 1055 170 h -60 M 1055 170 v 60"/>
    <path d="M 545 440 h 60 M 545 440 v -60"/>
    <path d="M 1055 440 h -60 M 1055 440 v -60"/>
  </g>
  <circle cx="588" cy="196" r="9" fill="#ff3b30"/>
  <text x="612" y="205" font-family="Menlo, monospace" font-size="24" letter-spacing="4" fill="#ff3b30">REC</text>
  <text x="1040" y="420" text-anchor="end" font-family="Menlo, monospace" font-size="19" letter-spacing="3" fill="#9fb4ba" fill-opacity="0.85">TC 00:47:13:08</text>

  <!-- 标题区 -->
  <text x="800" y="445" text-anchor="middle" font-family="Menlo, monospace" font-size="15" letter-spacing="9" fill="#5f7077">A SHORT FILM</text>
  <rect x="740" y="472" width="120" height="2" fill="#c9a96a" fill-opacity="0.9"/>
  <text x="800" y="580" text-anchor="middle" font-family="'Songti SC','STSong','SimSun',serif" font-weight="700" font-size="88" letter-spacing="14" fill="#f2ede3">《未关机》</text>
  <text x="800" y="655" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="25" letter-spacing="14" fill="#c9a96a">导演 · 编剧 · 剪辑</text>

  <rect width="1600" height="900" fill="url(#vig)"/>
  <rect width="1600" height="900" filter="url(#noise)" opacity="0.045"/>
</svg>
