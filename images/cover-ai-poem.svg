<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0b24"/>
      <stop offset="60%" stop-color="#07061a"/>
      <stop offset="100%" stop-color="#040310"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#4f6fe0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4f6fe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#37c8e8"/>
      <stop offset="55%" stop-color="#6f7ff2"/>
      <stop offset="100%" stop-color="#a06df0"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- 诗句流动光线 -->
  <path d="M 180 300 C 450 170, 640 380, 830 260 S 1180 140, 1420 250" fill="none" stroke="url(#flow)" stroke-width="12" opacity="0.14" filter="url(#soft)"/>
  <path d="M 180 300 C 450 170, 640 380, 830 260 S 1180 140, 1420 250" fill="none" stroke="url(#flow)" stroke-width="2.5" opacity="0.85"/>
  <path d="M 260 210 C 520 330, 760 150, 1010 320 S 1300 380, 1440 330" fill="none" stroke="url(#flow)" stroke-width="1.6" opacity="0.35"/>

  <!-- 数据尘埃 -->
  <g fill="#7ee3ff">
    <circle cx="240" cy="180" r="3.5" opacity="0.55"/><circle cx="420" cy="330" r="2.5" opacity="0.35"/>
    <circle cx="560" cy="130" r="4" opacity="0.45"/><circle cx="700" cy="300" r="2" opacity="0.5"/>
    <circle cx="905" cy="175" r="3" opacity="0.6"/><circle cx="1030" cy="340" r="2.5" opacity="0.3"/>
    <circle cx="1190" cy="205" r="4.5" opacity="0.5"/><circle cx="1345" cy="150" r="2.5" opacity="0.4"/>
    <circle cx="1450" cy="300" r="3" opacity="0.35"/><circle cx="640" cy="235" r="2" opacity="0.45"/>
  </g>
  <g fill="#b39dff">
    <circle cx="330" cy="260" r="2.5" opacity="0.4"/><circle cx="505" cy="210" r="3" opacity="0.3"/>
    <circle cx="840" cy="320" r="3.5" opacity="0.45"/><circle cx="1110" cy="140" r="2" opacity="0.5"/>
    <circle cx="1265" cy="280" r="3" opacity="0.35"/><circle cx="975" cy="230" r="2.5" opacity="0.4"/>
  </g>

  <!-- 标题区 -->
  <text x="800" y="445" text-anchor="middle" font-family="Menlo, monospace" font-size="15" letter-spacing="9" fill="#4d5a86">A SHORT FILM</text>
  <rect x="740" y="472" width="120" height="2" fill="#8f9bf0" fill-opacity="0.9"/>
  <text x="800" y="580" text-anchor="middle" font-family="'Songti SC','STSong','SimSun',serif" font-weight="700" font-size="88" letter-spacing="14" fill="#eeeaf6">《AI的诗》</text>
  <text x="800" y="655" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="25" letter-spacing="14" fill="#9aa6f5">导演 · 编剧</text>

  <rect width="1600" height="900" fill="url(#vig)"/>
  <rect width="1600" height="900" filter="url(#noise)" opacity="0.045"/>
</svg>
